# Reference service spec. The deploy script applies equivalent flags.
# Showcase uses the in-memory catalog (no Firestore required).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ghana-restaurant-showcase
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: IMAGE
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: staging
            - name: PAYMENT_PROVIDER
              value: mock
            - name: DELIVERY_PROVIDER
              value: mock
            - name: EMAIL_PROVIDER
              value: mock
            - name: DATA_STORE
              value: firestore
          startupProbe:
            httpGet:
              path: /api/health
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
            timeoutSeconds: 3
            periodSeconds: 30
