# Used by `gcloud builds submit` and the GitHub deploy workflow.
substitutions:
  _IMAGE: europe-north1-docker.pkg.dev/PROJECT/apps/ghana-restaurant-showcase:latest

timeout: 1800s

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--progress=plain", "-t", "${_IMAGE}", "."]
    timeout: 1500s
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

images:
  - "${_IMAGE}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_32
  diskSizeGb: 100
